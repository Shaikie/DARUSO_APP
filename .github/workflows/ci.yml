name: Laravel CI

on:
  push:
    branches:
      - main
      - feat/daruso-platform-hardening
      - feat/daruso-complete-platform-overhaul
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Tests and frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Preview PHP formatting corrections
        run: |
          vendor/bin/pint app/Enums/StudentStatus.php app/Enums/PermissionName.php app/Enums/PaymentRequestStatus.php app/Enums/PaymentSubmissionStatus.php app/Http/Controllers/PlatformController.php app/Http/Controllers/PaymentController.php app/Http/Controllers/Leader/StudentController.php app/Models/PaymentRequest.php app/Models/PaymentSubmission.php app/Mail/NotificationMail.php app/Services/NotificationDispatcher.php app/Services/NotificationPreferenceService.php app/Services/GlobalSearchService.php app/Services/CalendarService.php app/Services/PollService.php app/Services/FeedbackService.php app/Services/ActivityReportService.php app/Services/LeadershipInvitationService.php app/Services/PaymentRequestService.php app/Services/StudentVerificationService.php database/migrations/2026_11_02_000001_create_payment_requests_and_submissions.php database/seeders/RoleSeeder.php routes/web.php tests/Feature/PlatformFeaturesTest.php tests/Feature/PrivatePaymentWorkflowTest.php app/Http/Controllers/Leader/StudentController.php app/Http/Controllers/Leader/DashboardController.php app/Http/Controllers/ProfileController.php app/Http/Controllers/StudentProfileController.php app/Http/Middleware/EnsureActiveStudent.php app/Http/Middleware/EnsureActiveAccount.php app/Http/Middleware/EnsureLeader.php app/Http/Requests/StoreStudentProfileRequest.php app/Models/User.php database/factories/UserFactory.php bootstrap/app.php database/migrations/2026_11_01_120000_add_pending_student_verification_status.php routes/auth.php app/Services/StudentVerificationService.php app/Http/Requests/Auth/LoginRequest.php app/Http/Controllers/Auth/RegisteredUserController.php app/Http/Controllers/Auth/VerifyEmailController.php tests/Feature/Auth/AuthenticationTest.php tests/Feature/Auth/EmailVerificationTest.php tests/Feature/Auth/RegistrationTest.php tests/Feature/LeadershipAccessTest.php tests/Feature/Authorization/RolePermissionTest.php tests/Feature/AccountLifecycleTest.php tests/Feature/MeetingEventTest.php tests/Feature/ProfileTest.php tests/Feature/StudentVerificationTest.php
          git diff -- app/Enums/StudentStatus.php app/Enums/PermissionName.php app/Enums/PaymentRequestStatus.php app/Enums/PaymentSubmissionStatus.php app/Http/Controllers/PlatformController.php app/Http/Controllers/PaymentController.php app/Http/Controllers/Leader/StudentController.php app/Models/PaymentRequest.php app/Models/PaymentSubmission.php app/Mail/NotificationMail.php app/Services/NotificationDispatcher.php app/Services/NotificationPreferenceService.php app/Services/GlobalSearchService.php app/Services/CalendarService.php app/Services/PollService.php app/Services/FeedbackService.php app/Services/ActivityReportService.php app/Services/LeadershipInvitationService.php app/Services/PaymentRequestService.php app/Services/StudentVerificationService.php database/migrations/2026_11_02_000001_create_payment_requests_and_submissions.php database/seeders/RoleSeeder.php routes/web.php tests/Feature/PlatformFeaturesTest.php tests/Feature/PrivatePaymentWorkflowTest.php app/Http/Controllers/Leader/StudentController.php app/Http/Controllers/Leader/DashboardController.php app/Http/Controllers/ProfileController.php app/Http/Controllers/StudentProfileController.php app/Http/Middleware/EnsureActiveStudent.php app/Http/Middleware/EnsureActiveAccount.php app/Http/Middleware/EnsureLeader.php app/Http/Requests/StoreStudentProfileRequest.php app/Models/User.php database/factories/UserFactory.php bootstrap/app.php database/migrations/2026_11_01_120000_add_pending_student_verification_status.php routes/auth.php app/Services/StudentVerificationService.php app/Http/Requests/Auth/LoginRequest.php app/Http/Controllers/Auth/RegisteredUserController.php app/Http/Controllers/Auth/VerifyEmailController.php tests/Feature/Auth/AuthenticationTest.php tests/Feature/Auth/EmailVerificationTest.php tests/Feature/Auth/RegistrationTest.php tests/Feature/LeadershipAccessTest.php tests/Feature/Authorization/RolePermissionTest.php tests/Feature/AccountLifecycleTest.php tests/Feature/MeetingEventTest.p