name: Laravel CI

on:
  push:
    branches:
      - main
      - feat/daruso-platform-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Tests and frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check PHP formatting
        run: >-
          vendor/bin/pint --test
          app/Enums/StudentStatus.php
          app/Http/Controllers/Leader/StudentController.php
          app/Http/Controllers/Leader/DashboardController.php
          app/Http/Controllers/ProfileController.php
          app/Http/Controllers/StudentProfileController.php
          app/Http/Middleware/EnsureActiveStudent.php
          app/Http/Middleware/EnsureLeader.php
          app/Http/Requests/StoreStudentProfileRequest.php
          app/Models/User.php
          bootstrap/app.php
          database/migrations/2026_11_01_120000_add_pending_student_verification_status.php
          routes/auth.php
          tests/Feature/Auth/RegistrationTest.php
          tests/Feature/LeadershipAccessTest.php
          tests/Feature/ProfileTest.php
          tests/Feature/StudentVerificationTest.php

      - name: Run feature and unit tests
        run: php artisan test
